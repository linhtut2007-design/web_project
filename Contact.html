<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Store | Contact Us</title>
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 24px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a.active, nav a:hover {
            color: #3498db;
        }

    
        .contact-container {
            display: flex;
            max-width: 1000px;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .contact-info {
            background: #3498db;
            color: white;
            padding: 40px;
            flex: 1;
        }

        .contact-info h3 {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .contact-info p {
            margin-bottom: 15px;
            font-size: 15px;
        }

        .contact-form {
            padding: 40px;
            flex: 2;
        }

        .contact-form h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .btn {
            background-color: #2c3e50;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #1a252f;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
            margin-top: 60px;
        }
    </style>
</head>
<body>


    <header>
        <h1>LaptopStore</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="Products.html">Products</a>
            <a href="About.html">About Us</a>
            <a href="Contact.html" class="active">Contact Us</a>
            <a href="FAQ.html">FAQ</a>
        </nav>
    </header>


    <div class="contact-container">
        
        <!-- Info Sidebar -->
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p><strong>Address:</strong><br>Pyi Yate Thar Campus</p>
            <p><strong>Email:</strong><br>lin@gmail.com</p>
            <p><strong>Phone:</strong><br>+95 123456789</p>
        </div>

    
        <div class="contact-form">
            <h2>Send us a Message</h2>
            <form onsubmit="event.preventDefault(); alert('Message successfully sent to our team!');">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" placeholder="John Doe" >
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="john@example.com" >
                </div>
                
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" placeholder="How can we help you today?" required></textarea>
                </div>
                
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>


    <footer>
        <p>&copy; 2026 LaptopStore - Student Web Project</p>
    </footer>

</body>
</html>
